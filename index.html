<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b172b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Converter"><title>Unit Converter</title>
<style>
:root{color-scheme:dark;--bg:#0b172b;--panel:#172a43;--panel2:#213a58;--text:#f6faff;--muted:#b0c4d9;--accent:#43a5ef;--border:#314b69}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#19395c 0%,var(--bg) 50%);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100dvh}main{width:min(100%,560px);margin:auto;padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 28px)}.eyebrow{color:var(--muted);font-weight:700;letter-spacing:.17em;font-size:12px}.heading{display:flex;align-items:center;gap:12px;margin:9px 0 4px}.symbol{background:#23649c;border-radius:16px;width:54px;height:54px;display:grid;place-items:center;font-size:27px}h1{font-size:30px;letter-spacing:-.04em;margin:0}.sub{color:var(--muted);font-size:14px;margin:5px 0 22px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}.tab{border:1px solid var(--border);background:var(--panel);color:var(--muted);border-radius:13px;padding:13px 5px;font:600 14px inherit;font-weight:700;cursor:pointer}.tab[aria-selected=true]{background:#21649b;color:white;border-color:#57b8fc}.card{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 12px 30px #0002}.label{display:block;color:var(--muted);font-size:12px;font-weight:750;letter-spacing:.1em;margin-bottom:10px}.field{display:flex;gap:10px;align-items:stretch}input,select{background:#0e2036;color:var(--text);border:1px solid #395a7a;border-radius:12px;min-width:0;min-height:58px;font:inherit}input{font-size:28px;font-weight:700;width:55%;padding:10px 12px;outline:none}input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}select{font-size:15px;padding:8px;width:45%}.swaprow{display:flex;justify-content:center;margin:-1px 0}.swap{border:1px solid #5aaddd;border-radius:50%;width:52px;height:52px;background:#1b5c91;color:white;font-size:25px;cursor:pointer}.result{font-size:31px;font-weight:750;letter-spacing:-.02em;overflow-wrap:anywhere;min-height:40px}.resultline{color:var(--muted);font-size:14px;margin-top:10px}.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1;background:var(--panel2);color:white;border:1px solid var(--border);border-radius:12px;padding:13px;font:600 15px -apple-system,BlinkMacSystemFont,sans-serif;cursor:pointer}.actions button:active,.tab:active,.swap:active{filter:brightness(1.3)}.note{color:var(--muted);font-size:12px;text-align:center;line-height:1.5;margin-top:18px}#toast{color:#9fe5b3;text-align:center;min-height:22px;font-size:13px;margin-top:10px}@media(max-width:370px){h1{font-size:26px}.tab{font-size:12px}.card{padding:13px}input{font-size:23px}select{font-size:13px}}@media(min-width:650px){main{padding-top:50px}}
</style></head><body><main><div class="eyebrow">YOUR EVERYDAY TOOLS</div><div class="heading"><div class="symbol" aria-hidden="true">⇄</div><h1>Unit Converter</h1></div><p class="sub">Fast, accurate conversions in both directions.</p><nav class="tabs" id="tabs" aria-label="Conversion categories"></nav><section class="card"><label class="label" for="amount">CONVERT FROM</label><div class="field"><input id="amount" type="number" inputmode="decimal" step="any" value="1" aria-label="Amount to convert"><select id="from" aria-label="From unit"></select></div></section><div class="swaprow"><button class="swap" id="swap" aria-label="Swap units" title="Swap units">⇅</button></div><section class="card" aria-live="polite"><div class="label">CONVERT TO</div><div class="field"><div class="result" id="result">—</div><select id="to" aria-label="To unit"></select></div><div class="resultline" id="formula"></div><div class="actions"><button id="copy">Copy result</button><button id="clear">Clear</button></div></section><div id="toast" role="status"></div><p class="note">Uses exact standard conversion factors where defined. UK imperial volumes are used. No internet connection required for calculations.</p></main>
<script>
'use strict';
const groups={
 Distance:{mi:['Miles',1609.344],km:['Kilometres',1000],m:['Metres',1],ft:['Feet',0.3048],in:['Inches',0.0254]},
 Weight:{kg:['Kilograms',1],lb:['Pounds',0.45359237],st:['Stones',6.35029318],oz:['Ounces',0.028349523125],g:['Grams',0.001]},
 Temperature:{c:['Celsius (°C)',0],f:['Fahrenheit (°F)',0],k:['Kelvin (K)',0]},
 Volume:{l:['Litres',1],ml:['Millilitres',0.001],pt:['UK pints',0.56826125],gal:['UK gallons',4.54609],floz:['UK fl oz',0.0284130625]},
 Speed:{mph:['Miles/hour',0.44704],kmh:['Kilometres/hour',1/3.6],kn:['Knots',1852/3600],ms:['Metres/second',1]}
};
const defaults={Distance:['mi','km'],Weight:['lb','kg'],Temperature:['c','f'],Volume:['l','pt'],Speed:['mph','kmh']};
const $=id=>document.getElementById(id);let category='Distance',lastResult=null;
function format(v){if(!Number.isFinite(v))return 'Out of range';if(Object.is(v,-0))v=0;return new Intl.NumberFormat('en-GB',{maximumFractionDigits:8}).format(v)}
function convert(n,from,to){if(category==='Temperature'){let c=from==='c'?n:from==='f'?(n-32)*5/9:n-273.15;return to==='c'?c:to==='f'?c*9/5+32:c+273.15}return n*groups[category][from][1]/groups[category][to][1]}
function recalc(){let n=$('amount').value.trim();if(n===''){lastResult=null;$('result').textContent='—';$('formula').textContent='Enter a value to convert';return}let value=Number(n);if(!Number.isFinite(value)){lastResult=null;$('result').textContent='Invalid value';return}let from=$('from').value,to=$('to').value;lastResult=convert(value,from,to);$('result').textContent=format(lastResult);$('formula').textContent=`${format(value)} ${groups[category][from][0]} = ${format(lastResult)} ${groups[category][to][0]}`}
function fillSelect(el,selected){el.replaceChildren();for(const [key,[name]] of Object.entries(groups[category])){let opt=document.createElement('option');opt.value=key;opt.textContent=name;el.append(opt)}el.value=selected}
function setCategory(name){category=name;for(const b of document.querySelectorAll('.tab'))b.setAttribute('aria-selected',String(b.textContent===name));fillSelect($('from'),defaults[name][0]);fillSelect($('to'),defaults[name][1]);recalc()}
for(const name of Object.keys(groups)){const b=document.createElement('button');b.className='tab';b.type='button';b.textContent=name;b.setAttribute('aria-selected','false');b.addEventListener('click',()=>setCategory(name));$('tabs').append(b)}
$('amount').addEventListener('input',recalc);$('from').addEventListener('change',recalc);$('to').addEventListener('change',recalc);
$('swap').addEventListener('click',()=>{const oldFrom=$('from').value;$('from').value=$('to').value;$('to').value=oldFrom;recalc()});
$('clear').addEventListener('click',()=>{$('amount').value='';recalc();$('amount').focus()});
$('copy').addEventListener('click',async()=>{if(lastResult===null)return;const value=format(lastResult);try{await navigator.clipboard.writeText(value);$('toast').textContent='Result copied'}catch(e){$('toast').textContent='Select the result to copy it'}setTimeout(()=>{$('toast').textContent=''},2200)});
setCategory('Distance');
</script></body></html>
